# Service SOAP de clients : MySQL (source) -> Airflow -> MongoDB (référence) -> Laravel SOAP ; supervision Zabbix.
# Démarrage : docker compose up -d --build

x-mysql-env: &mysql-env
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE:-clients_src}
  MYSQL_USER: ${MYSQL_USER:-app}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}

x-mongo-env: &mongo-env
  MONGO_URI: mongodb://app:${MONGO_APP_PASSWORD:-app_password}@mongo:27017/clients_db?authSource=clients_db
  MONGO_DB: clients_db

x-airflow-common: &airflow-common
  build: ./airflow
  environment: &airflow-env
    <<: [*mysql-env, *mongo-env]
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "soap-clients-demo-secret-key"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-db: { condition: service_healthy }
    mysql: { condition: service_healthy }
    mongo: { condition: service_healthy }

services:
  # ---------------------------------------------------------------- Bases de données
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-clients_src}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports: ["3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/mysql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/mysql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-root_password}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-app_password}
    ports: ["27018:27017"]
    volumes:
      - mongo-data:/data/db
      - ./db/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- Airflow
  airflow-db:
    image: postgres:16
    environment: { POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow }
    volumes: [airflow-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db migrate &&
        (airflow users create --username ${AIRFLOW_ADMIN_USER:-admin} --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
        --firstname Admin --lastname IBAM --role Admin --email admin@example.bf || true)
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8081:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      retries: 10

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: { condition: service_completed_successfully }

  # ---------------------------------------------------------------- Service SOAP (Laravel)
  laravel:
    build:
      context: .
      dockerfile: docker/laravel.Dockerfile
    environment:
      <<: *mongo-env
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
    ports: ["8080:80"]
    depends_on:
      mongo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 10s
      retries: 12

  # ---------------------------------------------------------------- Supervision Zabbix
  zabbix-db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
    volumes: [zabbix-db-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30

  zabbix-server:
    image: zabbix/zabbix-server-mysql:ubuntu-7.0-latest
    environment:
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
    ports: ["10051:10051"]
    depends_on:
      zabbix-db: { condition: service_healthy }

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:ubuntu-7.0-latest
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-db
      MYSQL_DATABASE: zabbix
      MYSQL_USER: zabbix
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix_password}
      PHP_TZ: Africa/Ouagadougou
    ports: ["8082:8080"]
    depends_on: [zabbix-server]

  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-7.0-latest
    hostname: soap-clients-agent
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: soap-clients-agent
    depends_on: [zabbix-server]

volumes:
  mysql-data:
  mongo-data:
  airflow-db-data:
  airflow-logs:
  zabbix-db-data:
